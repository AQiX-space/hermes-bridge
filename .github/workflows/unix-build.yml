name: Hermes Connector Unix development checks
on:
  push:
    branches:
      - feat/connector-persistent-20261123
    paths:
      - clients/unix/**
      - tests/unix/**
      - .github/workflows/unix-build.yml
  workflow_dispatch:
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: HermesConnector-Linux-x64-dev-unsigned
          - os: ubuntu-24.04-arm
            artifact: HermesConnector-Linux-arm64-dev-unsigned
          - os: macos-15
            artifact: HermesConnector-macOS-arm64-dev-unsigned
          - os: macos-15-intel
            artifact: HermesConnector-macOS-x64-dev-unsigned
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'keyring>=25,<26' 'pyinstaller>=6,<7' 'secretstorage>=3.3,<4' 'asyncssh>=2.18,<3' 'pystray>=0.19,<0.21' 'Pillow>=10,<12'
      - name: Confirm GUI toolkit is available for packaging
        run: |
          python -c "import tkinter; print('GUI toolkit Tk', tkinter.TkVersion)"
      - name: "Unit tests: OS identity, HMAC, broker, keyring, lock"
        run: python -m unittest discover -s tests/unix -p 'test_*.py' -v
      - name: Linux/macOS CLI check
        run: |
          python clients/unix/main.py --help
          python clients/unix/main.py --version
          python -m py_compile clients/unix/gui.py
          python clients/unix/main.py doctor
          python clients/unix/main.py setup-ssh client
          python clients/unix/main.py setup-ssh server
      - name: Package standalone per-user binary
        run: |
          python -m PyInstaller --onefile --noconfirm --clean --name HermesConnector \
            --collect-submodules keyring.backends --collect-submodules pystray clients/unix/main.py
          ./dist/HermesConnector --help
          ./dist/HermesConnector --version
          ./dist/HermesConnector doctor
          shasum -a 256 dist/HermesConnector
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/HermesConnector
          retention-days: 7
