name: Manual private preview release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected version, e.g. 0.2.0-beta.1'
        required: true
        type: string
permissions:
  contents: write
jobs:
  preview:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate version contract
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_VERSION -cne $version) { throw "VERSION mismatch: requested $env:RELEASE_VERSION, source $version" }
          if ($version -notmatch '^\d+\.\d+\.\d+-beta\.\d+$') { throw "Only beta prereleases allowed" }
      - name: Compile Windows executable
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /optimize+ /out:HermesBridgeUpdater.exe updater\Program.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $csc /nologo /target:winexe /optimize+ /out:HermesBridge.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll /resource:HermesBridgeUpdater.exe,HermesBridgeUpdater.exe src\Program.cs src\UpdateClient.cs src\GitHubUpdater.cs src\VersionInfo.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Store preview in private draft for independent security check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $tag="v$env:RELEASE_VERSION"
          gh release create $tag HermesBridge.exe --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Гермес Мост $env:RELEASE_VERSION · проверка безопасности" --prerelease --draft --notes "DRAFT. Not approved. Awaiting Defender scan and code-signing review. Do not install."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
