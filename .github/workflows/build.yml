name: Validate Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile and check Windows EXE
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /optimize+ /out:HermesBridgeUpdater.exe updater\Program.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $csc /nologo /target:winexe /optimize+ /out:HermesBridge.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll /resource:HermesBridgeUpdater.exe,HermesBridgeUpdater.exe src\Program.cs src\UpdateClient.cs src\VersionInfo.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash HermesBridge.exe -Algorithm SHA256 | Format-List
          $sig=Get-AuthenticodeSignature HermesBridge.exe
          Write-Output "Authenticode status: $($sig.Status)"
          Write-Output 'Developer build only. Release publication disabled until code signing and Defender review are complete.'
      - name: Cryptographic update regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:UpdateVerifyTests.exe /reference:System.Web.Extensions.dll src\UpdateClient.cs tests\UpdateVerifyTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\UpdateVerifyTests.exe tests\fixtures\signed-beta1.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enrollment regression tests
        shell: pwsh
        run: python server/test_enroll.py
