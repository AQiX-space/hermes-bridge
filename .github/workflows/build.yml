name: Validate Windows build
on:
  workflow_dispatch:
  push:
    branches: [main, feature/gr-gateway-failover, fix/recovery-from-dead-gate, fix/connector-current-user-agent, feat/connector-persistent-20261123]
permissions:
  contents: read
jobs:
  linux-session-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Isolated Linux pidfd process termination smoke test
        run: python3 tools/test_gate_pidfd_linux.py
      - name: Refuse unrelated live TCP listeners
        run: python3 tools/test_session_closer_linux.py
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile and check Windows EXE
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /optimize+ /out:HermesBridgeUpdater.exe updater\Program.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $csc /nologo /target:winexe /optimize+ /win32icon:assets\HermesConnector.ico /out:HermesBridge.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll /reference:System.Security.dll /reference:System.ServiceProcess.dll /resource:HermesBridgeUpdater.exe,HermesBridgeUpdater.exe src\Program.cs src\AutoUpdatePolicy.cs src\ResidentPinDialog.cs src\ResidentPinStore.cs src\ElevationSupport.cs src\SshTransportOptions.cs src\SingleInstanceGate.cs src\ReconnectPolicy.cs src\ConnectorPreferences.cs src\ActivityJournal.cs src\OpenSshComponents.cs src\WindowsStartup.cs src\UserSessionAgent.cs src\EmergencyRecovery.cs src\TunnelProbe.cs src\SshEvents.cs src\EnrollmentClient.cs src\TicketStore.cs src\UpdateClient.cs src\GitHubUpdater.cs src\VersionInfo.cs src\SshServerHealth.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash HermesBridge.exe -Algorithm SHA256 | Format-List
          $sig=Get-AuthenticodeSignature HermesBridge.exe
          Write-Output "Authenticode status: $($sig.Status)"
          Write-Output 'Developer build only. Release publication disabled until code signing and Defender review are complete.'
      - name: Build and verify offline recovery installer for 0.2.9
        if: github.ref == 'refs/heads/fix/recovery-from-dead-gate'
        shell: pwsh
        run: |
          $hash=(Get-FileHash HermesBridge.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $source=Get-Content installer\RecoveryInstaller.cs -Raw
          if (-not $source.Contains('__PAYLOAD_SHA256__')) { throw 'Installer source digest placeholder missing' }
          $source.Replace('__PAYLOAD_SHA256__',$hash) | Set-Content installer\RecoveryInstaller.pinned.cs -Encoding UTF8
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /out:HermesRecoveryInstaller.exe /reference:System.Windows.Forms.dll /resource:HermesBridge.exe,HermesBridge.exe installer\RecoveryInstaller.pinned.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\HermesRecoveryInstaller.exe --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Installer embedded payload verification failed' }
      - name: Store private offline recovery installer
        if: github.ref == 'refs/heads/fix/recovery-from-dead-gate'
        uses: actions/upload-artifact@v4
        with:
          name: HermesRecoveryInstaller-0.2.9
          path: HermesRecoveryInstaller.exe
          retention-days: 7
      - name: Reject untrusted and draft versions from automatic updater
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:AutoReleaseSelectionTests.exe /reference:System.Web.Extensions.dll src\VersionInfo.cs src\GitHubUpdater.cs tests\AutoReleaseSelectionTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\AutoReleaseSelectionTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Beta update version and EXE metadata regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:UpdaterVersionTests.exe /reference:System.Web.Extensions.dll src\VersionInfo.cs src\GitHubUpdater.cs tests\UpdaterVersionTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\UpdaterVersionTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exeVersion=(Get-Item HermesBridge.exe).VersionInfo.ProductVersion
          if ($exeVersion -cne '0.3.0-beta.2') { throw "Wrong packaged EXE ProductVersion: $exeVersion" }
      - name: Cryptographic update regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:UpdateVerifyTests.exe /reference:System.Web.Extensions.dll src\UpdateClient.cs tests\UpdateVerifyTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\UpdateVerifyTests.exe tests\fixtures\signed-beta1.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Update swap and rollback tests
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'hermes-updater-regression'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $dst=Join-Path $root 'Hermes Connector (1).exe'
          $src=Join-Path $root 'candidate.exe'
          Copy-Item HermesBridge.exe $dst
          Copy-Item HermesBridge.exe $src
          [IO.File]::AppendAllText($src,'test-candidate-marker')
          $oldHash=(Get-FileHash $dst -Algorithm SHA256).Hash
          $hash=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          & .\HermesBridgeUpdater.exe '2147483646' $src $dst $hash 'test-no-launch'
          if ($LASTEXITCODE -ne 0) { throw "swap failed: $LASTEXITCODE" }
          if ((Get-FileHash $dst -Algorithm SHA256).Hash -cne $hash.ToUpperInvariant()) { throw 'new binary not installed' }
          if ((Get-FileHash "$dst.previous" -Algorithm SHA256).Hash -cne $oldHash) { throw 'backup not preserved' }
          Write-Output 'PASS: verified replacement and backup'
          Copy-Item HermesBridge.exe $dst -Force
          [IO.File]::WriteAllText($src,'not-a-real-exe')
          $hash=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          & .\HermesBridgeUpdater.exe '2147483646' $src $dst $hash 'launch'
          if ($LASTEXITCODE -ne 10) { throw "expected rollback exit 10, got: $LASTEXITCODE" }
          if ((Get-FileHash $dst -Algorithm SHA256).Hash -cne $oldHash) { throw 'rollback failed' }
          Write-Output 'PASS: failed launch restores previous version'
          Remove-Item -Recurse -Force $root
          exit 0 # expected rollback helper exit=10 must not become job exit
      - name: Updater launches new Windows process with automatic tunnel resume
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $root=Join-Path $env:RUNNER_TEMP 'hermes-updater-resume'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          & $csc /nologo /target:exe /out:"$root\ResumeStub.exe" tests\UpdaterLaunchResumeStub.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dst=Join-Path $root 'HermesConnector.exe'
          $src=Join-Path $root 'new-release.exe'
          Copy-Item "$root\ResumeStub.exe" $dst
          Copy-Item "$root\ResumeStub.exe" $src
          $hash=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          & .\HermesBridgeUpdater.exe '2147483646' $src $dst $hash 'launch-resume'
          if ($LASTEXITCODE -ne 0) { throw "Updater resume failed: $LASTEXITCODE" }
          $marker="$dst.argv"
          for($i=0;$i -lt 20 -and !(Test-Path $marker);$i++){ Start-Sleep -Milliseconds 200 }
          if (!(Test-Path $marker)) { throw 'New process did not launch' }
          if ((Get-Content $marker -Raw).Trim() -cne '--resume-update') { throw 'New process did not receive resume-update flag' }
          Write-Output 'PASS: rollback-capable updater launches replacement with resume-update flag'
          Start-Sleep -Seconds 2
          Remove-Item $marker -Force
          # Deliberately corrupt a candidate whose SHA256 *matches*. The
          # launcher must rollback and restart the previously working client.
          $goodHash=(Get-FileHash $dst -Algorithm SHA256).Hash
          [IO.File]::WriteAllText($src,'malformed-not-an-exe')
          $badHash=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          & .\HermesBridgeUpdater.exe '2147483646' $src $dst $badHash 'launch-resume'
          if ($LASTEXITCODE -ne 10) { throw "Expected rollback exit code 10, got $LASTEXITCODE" }
          if ((Get-FileHash $dst -Algorithm SHA256).Hash -cne $goodHash) { throw 'Previous binary not restored' }
          for($i=0;$i -lt 20 -and !(Test-Path $marker);$i++){ Start-Sleep -Milliseconds 200 }
          if (!(Test-Path $marker)) { throw 'Previously working Connector not restarted after rollback' }
          Write-Output 'PASS: failed auto-update restored and restarted prior client'
          # The rollback test EXE intentionally remains alive briefly. Wait
          # for its 3.2 second lifetime before deleting the Windows-locked PE.
          Start-Sleep -Seconds 6
          Remove-Item -Recurse -Force $root
          exit 0
      - name: SSH event parsing regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:SshEventsTests.exe src\SshEvents.cs tests\SshEventsTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\SshEventsTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows OpenSSH Server preflight regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:SshServerHealthTests.exe /reference:System.ServiceProcess.dll src\SshServerHealth.cs tests\SshServerHealthTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\SshServerHealthTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reconnect policy tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:ReconnectPolicyTests.exe src\ReconnectPolicy.cs tests\ReconnectPolicyTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ReconnectPolicyTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bounded SSH connection and keepalive options tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:SshTransportOptionsTests.exe src\SshTransportOptions.cs tests\SshTransportOptionsTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\SshTransportOptionsTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Single Windows profile instance and release tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:SingleInstanceGateTests.exe src\SingleInstanceGate.cs tests\SingleInstanceGateTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\SingleInstanceGateTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sanitized persistent journal and size bound tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:ActivityJournalTests.exe src\ActivityJournal.cs tests\ActivityJournalTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ActivityJournalTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Simulate OpenSSH Server installation without changing Windows capabilities
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:DumpOpenSshScript.exe /reference:System.ServiceProcess.dll src\OpenSshComponents.cs src\SshServerHealth.cs tests\DumpOpenSshScript.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\DumpOpenSshScript.exe | Out-File -FilePath generated-openssh-install.ps1 -Encoding utf8
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\tests\OpenSshInstallMock.ps1 -ScriptFile generated-openssh-install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Persistent and temporary mode plus native SSH feature tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:ConnectorPreferencesTests.exe /reference:System.ServiceProcess.dll src\ReconnectPolicy.cs src\ConnectorPreferences.cs src\OpenSshComponents.cs src\SshServerHealth.cs tests\ConnectorPreferencesTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ConnectorPreferencesTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: User-scoped Windows autostart enable and removal tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:WindowsStartupTests.exe src\WindowsStartup.cs tests\WindowsStartupTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\WindowsStartupTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Automatic update while connected and safe restart policy tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:AutoUpdatePolicyTests.exe src\AutoUpdatePolicy.cs tests\AutoUpdatePolicyTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\AutoUpdatePolicyTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: PIN access and persistent lockout regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:ResidentPinStoreTests.exe /reference:System.Security.dll src\ResidentPinStore.cs tests\ResidentPinStoreTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ResidentPinStoreTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows UAC same-identity launch guard tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:ElevationSupportTests.exe src\ElevationSupport.cs tests\ElevationSupportTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ElevationSupportTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Current-user local agent authentication and identity tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:UserSessionAgentTests.exe /reference:System.Web.Extensions.dll src\UserSessionAgent.cs tests\UserSessionAgentTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\UserSessionAgentTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows enrollment client regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:EnrollmentClientTests.exe /reference:System.Web.Extensions.dll /reference:System.Security.dll src\EnrollmentClient.cs tests\EnrollmentClientTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\EnrollmentClientTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Offline Gate recovery regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:EmergencyRecoveryTests.exe src\EmergencyRecovery.cs tests\EmergencyRecoveryTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\EmergencyRecoveryTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows ticket protection regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:TicketStoreTests.exe /reference:System.Security.dll src\TicketStore.cs tests\TicketStoreTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\TicketStoreTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Current-user operator command authentication tests
        shell: pwsh
        run: python tests/test_user_command_operator.py
      - name: MOS operator audit transport tests
        shell: pwsh
        run: python tools/test_mos_operator.py
      - name: Named MOS gateway resolution tests
        shell: pwsh
        run: python tools/test_mos_named.py
      - name: Scoped SSH session guard regression tests
        shell: pwsh
        run: python tools/test_gate_session_guard.py
      - name: Gate broker regression tests
        shell: pwsh
        run: |
          python server/enrollment/test_service.py
          python server/enrollment/test_registry.py
          python server/enrollment/test_http.py
          python server/enrollment/test_request_diagnostics.py
          python server/enrollment/test_resident_mode.py
          python server/enrollment/test_live_schema_migration.py
          python server/enrollment/test_multi_device.py
      - name: Enrollment regression tests
        shell: pwsh
        run: python server/test_enroll.py
      - name: Preserve private Connector 0.3 development build for target acceptance
        if: github.ref == 'refs/heads/feat/connector-persistent-20261123'
        uses: actions/upload-artifact@v4
        with:
          name: HermesConnector-0.3.0-dev-Windows-unsigned
          path: HermesBridge.exe
          retention-days: 7
      - name: Windows Defender scan of unsigned GR preview (fail closed)
        if: github.ref == 'refs/heads/feature/gr-gateway-failover'
        shell: pwsh
        run: |
          $cmd=Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (!(Test-Path -LiteralPath $cmd)) { throw 'Windows Defender is unavailable' }
          $scanOutput = (& $cmd -Scan -ScanType 3 -File (Resolve-Path HermesBridge.exe).Path 2>&1 | Out-String)
          $scanExit = $LASTEXITCODE
          Write-Output $scanOutput
          if ($scanExit -ne 0 -or $scanOutput -match '(?i)skipp(ed|ing)' -or $scanOutput -notmatch '(?i)found no threats') {
            throw "Windows Defender did not actually verify the EXE (exit=$scanExit). Use a trusted Windows host and verify the exact SHA256."
          }
      - name: Store unsigned GR diagnostic build (private, not a release)
        if: github.ref == 'refs/heads/feature/gr-gateway-failover' || github.ref == 'refs/heads/fix/recovery-from-dead-gate'
        uses: actions/upload-artifact@v4
        with:
          name: HermesConnector-GR1-GR2-unsigned-preview
          path: HermesBridge.exe
          retention-days: 7
