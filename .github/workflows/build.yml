name: Validate Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux-session-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Isolated Linux pidfd process termination smoke test
        run: python3 tools/test_gate_pidfd_linux.py
      - name: Refuse unrelated live TCP listeners
        run: python3 tools/test_session_closer_linux.py
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Compile and check Windows EXE
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /optimize+ /out:HermesBridgeUpdater.exe updater\Program.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $csc /nologo /target:winexe /optimize+ /win32icon:assets\HermesConnector.ico /out:HermesBridge.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Web.Extensions.dll /reference:System.Security.dll /resource:HermesBridgeUpdater.exe,HermesBridgeUpdater.exe src\Program.cs src\TunnelProbe.cs src\SshEvents.cs src\EnrollmentClient.cs src\TicketStore.cs src\UpdateClient.cs src\GitHubUpdater.cs src\VersionInfo.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash HermesBridge.exe -Algorithm SHA256 | Format-List
          $sig=Get-AuthenticodeSignature HermesBridge.exe
          Write-Output "Authenticode status: $($sig.Status)"
          Write-Output 'Developer build only. Release publication disabled until code signing and Defender review are complete.'
      - name: Cryptographic update regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:UpdateVerifyTests.exe /reference:System.Web.Extensions.dll src\UpdateClient.cs tests\UpdateVerifyTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\UpdateVerifyTests.exe tests\fixtures\signed-beta1.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Update swap and rollback tests
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'hermes-updater-regression'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $dst=Join-Path $root 'Hermes Connector (1).exe'
          $src=Join-Path $root 'candidate.exe'
          Copy-Item HermesBridge.exe $dst
          Copy-Item HermesBridge.exe $src
          [IO.File]::AppendAllText($src,'test-candidate-marker')
          $oldHash=(Get-FileHash $dst -Algorithm SHA256).Hash
          $hash=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          & .\HermesBridgeUpdater.exe '2147483646' $src $dst $hash 'test-no-launch'
          if ($LASTEXITCODE -ne 0) { throw "swap failed: $LASTEXITCODE" }
          if ((Get-FileHash $dst -Algorithm SHA256).Hash -cne $hash.ToUpperInvariant()) { throw 'new binary not installed' }
          if ((Get-FileHash "$dst.previous" -Algorithm SHA256).Hash -cne $oldHash) { throw 'backup not preserved' }
          Write-Output 'PASS: verified replacement and backup'
          Copy-Item HermesBridge.exe $dst -Force
          [IO.File]::WriteAllText($src,'not-a-real-exe')
          $hash=(Get-FileHash $src -Algorithm SHA256).Hash.ToLowerInvariant()
          & .\HermesBridgeUpdater.exe '2147483646' $src $dst $hash 'launch'
          if ($LASTEXITCODE -ne 10) { throw "expected rollback exit 10, got: $LASTEXITCODE" }
          if ((Get-FileHash $dst -Algorithm SHA256).Hash -cne $oldHash) { throw 'rollback failed' }
          Write-Output 'PASS: failed launch restores previous version'
          Remove-Item -Recurse -Force $root
          exit 0 # expected rollback helper exit=10 must not become job exit
      - name: SSH event parsing regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:SshEventsTests.exe src\SshEvents.cs tests\SshEventsTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\SshEventsTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows enrollment client regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:EnrollmentClientTests.exe /reference:System.Web.Extensions.dll /reference:System.Security.dll src\EnrollmentClient.cs tests\EnrollmentClientTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\EnrollmentClientTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows ticket protection regression tests
        shell: pwsh
        run: |
          $csc="$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:TicketStoreTests.exe /reference:System.Security.dll src\TicketStore.cs tests\TicketStoreTests.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\TicketStoreTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: MOS operator audit transport tests
        shell: pwsh
        run: python tools/test_mos_operator.py
      - name: Scoped SSH session guard regression tests
        shell: pwsh
        run: python tools/test_gate_session_guard.py
      - name: Gate broker regression tests
        shell: pwsh
        run: |
          python server/enrollment/test_service.py
          python server/enrollment/test_registry.py
          python server/enrollment/test_http.py
          python server/enrollment/test_multi_device.py
      - name: Enrollment regression tests
        shell: pwsh
        run: python server/test_enroll.py
